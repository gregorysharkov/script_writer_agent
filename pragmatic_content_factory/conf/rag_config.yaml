# RAG Constitutional Layer Configuration
# ======================================
# This file contains settings for chunking, embedding, and indexing.
# Changing these settings will trigger a full re-index on next run.

chunking:
  # Target size for each chunk in tokens
  chunk_size: 500
  # Overlap between consecutive chunks in tokens
  chunk_overlap: 50

embedding:
  # Gemini embedding model to use
  model: "text-embedding-004"
  # Embedding vector dimensions (768 for text-embedding-004)
  dimensions: 768
  # Number of texts to embed in parallel per batch
  batch_size: 10

indexing:
  # Number of concurrent workers for processing
  parallel_workers: 4

paths:
  # Directory for FAISS index storage
  index_dir: "data/faiss_index"
  # Name of the index file (without extension)
  index_name: "pcf-constitutional"
  # Dynamic documents managed by the Librarian
  taboo_list: "data/dynamic/taboo_list.md"
  style_adjustments: "data/dynamic/style_adjustments.md"

